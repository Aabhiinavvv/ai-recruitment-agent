name: Python CI

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q app.py agents.py workflow.py mcp_server.py recruitment_core
      - name: Run unit tests
        env:
          GEMINI_API_KEY: ""
          GOOGLE_API_KEY: ""
        run: python -m unittest discover -s tests -v
